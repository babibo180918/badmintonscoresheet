<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a5c3a">
<title>Badminton Score Sheet</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== Setup screen ===== -->
<section id="setup" class="screen">
  <div id="setup-top">
    <h1 data-i18n="ui.title">Badminton Score Sheet</h1>
    <button type="button" id="open-settings" title="Settings">&#9881;</button>
  </div>
  <form id="setup-form">
    <label>
      <span data-i18n="ui.courtNumber">Court number</span>
      <input type="text" id="court-number" inputmode="numeric" autocomplete="off">
    </label>

    <fieldset>
      <legend data-i18n="ui.matchType">Match type</legend>
      <label class="radio"><input type="radio" name="mode" value="singles" checked><span data-i18n="ui.singles">Singles</span></label>
      <label class="radio"><input type="radio" name="mode" value="doubles"><span data-i18n="ui.doubles">Doubles</span></label>
    </fieldset>

    <!-- the two sides, side by side with "vs" between them; the inputs
         carry hint placeholders instead of label titles -->
    <div id="sides">
      <div class="side-col">
        <input type="text" id="name0" autocomplete="off">
        <input type="text" id="club0" autocomplete="off">
        <input type="text" id="name0b" class="doubles-only" autocomplete="off">
        <div class="club-row doubles-only">
          <input type="text" id="club0b" autocomplete="off">
          <label class="same-club"><input type="checkbox" id="same0"><span data-i18n="ui.sameClub">Same club</span></label>
        </div>
      </div>
      <div id="vs" data-i18n="ui.vs">vs</div>
      <div class="side-col">
        <input type="text" id="name1" autocomplete="off">
        <input type="text" id="club1" autocomplete="off">
        <input type="text" id="name1b" class="doubles-only" autocomplete="off">
        <div class="club-row doubles-only">
          <input type="text" id="club1b" autocomplete="off">
          <label class="same-club"><input type="checkbox" id="same1"><span data-i18n="ui.sameClub">Same club</span></label>
        </div>
      </div>
    </div>

    <fieldset class="singles-only">
      <legend data-i18n="ui.firstServer">First server</legend>
      <label class="radio"><input type="radio" name="firstServer" value="0" checked><span id="fs0">Player 1</span></label>
      <label class="radio"><input type="radio" name="firstServer" value="1"><span id="fs1">Player 2</span></label>
    </fieldset>

    <fieldset class="doubles-only">
      <legend data-i18n="ui.firstServer">First server</legend>
      <label class="radio"><input type="radio" name="dblServer" value="0-0" checked><span id="ds00">Player 1</span></label>
      <label class="radio"><input type="radio" name="dblServer" value="0-1"><span id="ds01">Player 2</span></label>
      <label class="radio"><input type="radio" name="dblServer" value="1-0"><span id="ds10">Player 3</span></label>
      <label class="radio"><input type="radio" name="dblServer" value="1-1"><span id="ds11">Player 4</span></label>
    </fieldset>

    <fieldset class="doubles-only">
      <legend data-i18n="ui.firstReceiver">First receiver</legend>
      <label class="radio"><input type="radio" name="dblReceiver" value="0" checked><span id="dr0">Player 3</span></label>
      <label class="radio"><input type="radio" name="dblReceiver" value="1"><span id="dr1">Player 4</span></label>
    </fieldset>

    <fieldset>
      <legend data-i18n="ui.rightSide">Starts on umpire's right</legend>
      <label class="radio"><input type="radio" name="rightPlayer" value="0" checked><span id="rs0">Player 1</span></label>
      <label class="radio"><input type="radio" name="rightPlayer" value="1"><span id="rs1">Player 2</span></label>
    </fieldset>

    <div id="warmup">
      <span data-i18n="ui.warmUp">Warm-up</span>
      <span id="warmup-time">2:00</span>
      <button type="button" id="warmup-start" class="secondary" data-i18n="ui.start">Start</button>
    </div>

    <label>
      <span data-i18n="ui.language">Language</span>
      <select id="lang">
        <option value="en" selected>English</option>
        <option value="da">Dansk</option>
      </select>
    </label>

    <button type="submit" class="primary" data-i18n="ui.startMatch">Start match</button>
  </form>
  <button id="resume-match" class="secondary hidden" data-i18n="ui.resumeMatch">Resume previous match</button>
</section>

<!-- ===== Settings screen ===== -->
<section id="settings" class="screen hidden">
  <header id="settings-header">
    <h1 data-i18n="ui.settingsTitle">Settings</h1>
    <button type="button" id="settings-close" data-i18n="ui.close">Close</button>
  </header>

  <div class="settings-group-title" data-i18n="ui.settingsMatch">Match</div>
  <div class="settings-group">
    <label class="settings-row"><span data-i18n="ui.gameTo">Game to</span>
      <span class="settings-value"><input type="number" id="set-gameto" inputmode="numeric"></span></label>
    <label class="settings-row"><span data-i18n="ui.maxScore">Maximum score</span>
      <span class="settings-value"><input type="number" id="set-max" inputmode="numeric"></span></label>
    <label class="settings-row"><span data-i18n="ui.bestOf">Best of</span>
      <span class="settings-value"><select id="set-bestof">
        <option value="1">1</option><option value="3">3</option><option value="5">5</option>
      </select></span></label>
    <label class="settings-row"><span data-i18n="ui.intervalAt">Interval / switch sides at</span>
      <span class="settings-value"><input type="number" id="set-intervalat" inputmode="numeric"></span></label>
  </div>

  <div class="settings-group-title" data-i18n="ui.settingsDuration">Duration</div>
  <div class="settings-group">
    <label class="settings-row"><span data-i18n="ui.warmupTime">Warm-up time</span>
      <span class="settings-value"><input type="number" id="set-warmup" inputmode="numeric"><span class="unit">s.</span></span></label>
    <label class="settings-row"><span data-i18n="ui.intervalDur">Interval</span>
      <span class="settings-value"><input type="number" id="set-intervaldur" inputmode="numeric"><span class="unit">s.</span></span></label>
    <label class="settings-row"><span data-i18n="ui.betweenGamesDur">Between games</span>
      <span class="settings-value"><input type="number" id="set-between" inputmode="numeric"><span class="unit">s.</span></span></label>
  </div>

  <div class="settings-group-title" data-i18n="ui.settingsGeneral">General</div>
  <div class="settings-group">
    <label class="settings-row"><span data-i18n="ui.showShuttle">Show shuttle count</span>
      <span class="switch"><input type="checkbox" id="set-shuttle"><span class="knob"></span></span></label>
  </div>

  <button type="button" id="settings-reset" data-i18n="ui.resetSettings">Reset settings</button>
</section>

<!-- ===== Match screen ===== -->
<section id="match" class="screen hidden">
  <header id="topbar">
    <button id="btn-undo" title="Undo">&#8630; <span data-i18n="ui.undo">Undo</span></button>
    <button id="btn-shuttle" class="hidden" title="Shuttles used">&#127992; <span id="shuttle-count">1</span></button>
    <div id="games-summary"></div>
    <div id="match-clock"></div>
    <button id="btn-new" title="New match" data-i18n="ui.newMatch">New match</button>
  </header>

  <div id="announcement" aria-live="polite">
    <span id="announcement-text"></span>
    <span id="announcement-timer" class="hidden"></span>
    <button id="announcement-action" class="hidden"></button>
  </div>

  <main id="court">
    <button class="tapzone" id="zone-left">
      <div class="quarter q-top"><span class="q-court"></span><span class="q-name"></span></div>
      <div class="quarter q-bottom"><span class="q-court"></span><span class="q-name"></span></div>
      <div class="tz-center">
        <div class="tz-team hidden"></div>
        <div class="tz-score">0</div>
        <div class="tz-games"></div>
      </div>
    </button>
    <button class="tapzone" id="zone-right">
      <div class="quarter q-top"><span class="q-court"></span><span class="q-name"></span></div>
      <div class="quarter q-bottom"><span class="q-court"></span><span class="q-name"></span></div>
      <div class="tz-center">
        <div class="tz-team hidden"></div>
        <div class="tz-score">0</div>
        <div class="tz-games"></div>
      </div>
    </button>
    <!-- server → receiver arrow, drawn across the whole court -->
    <svg id="serve-arrow" class="hidden" aria-hidden="true">
      <defs>
        <!-- markerUnits="strokeWidth": the head scales with #serve-line's width -->
        <marker id="arrow-head" markerWidth="4" markerHeight="4" refX="3.2" refY="2"
                orient="auto" markerUnits="strokeWidth">
          <path d="M0,0 L4,2 L0,4 z" fill="#ffd54f"></path>
        </marker>
      </defs>
      <line id="serve-line" marker-end="url(#arrow-head)"></line>
    </svg>
    <!-- manual corrections: change ends / swap a pair's positions -->
    <button type="button" id="swap-ends" class="swap-btn" title="Change ends">&#8644;</button>
    <button type="button" id="swap-left" class="swap-btn hidden" title="Swap players">&#8645;</button>
    <button type="button" id="swap-right" class="swap-btn hidden" title="Swap players">&#8645;</button>
  </main>

  <!-- Interval / between-games overlay -->
  <div id="overlay" class="hidden">
    <div id="overlay-box">
      <div id="overlay-title"></div>
      <div id="overlay-text" class="hidden"></div>
      <div id="overlay-warmup" class="hidden">
        <span data-i18n="ui.warmUp">Warm-up</span>
        <span id="overlay-warmup-time">2:00</span>
        <button type="button" id="overlay-warmup-start" class="secondary" data-i18n="ui.start">Start</button>
      </div>
      <!-- Doubles, between games: any player of the winning side may serve first,
           any player of the losing side may receive first -->
      <div id="overlay-doubles" class="hidden">
        <fieldset>
          <legend data-i18n="ui.firstServer">First server</legend>
          <label class="radio"><input type="radio" name="ngServer" value="0" checked><span id="ngs0"></span></label>
          <label class="radio"><input type="radio" name="ngServer" value="1"><span id="ngs1"></span></label>
        </fieldset>
        <fieldset>
          <legend data-i18n="ui.firstReceiver">First receiver</legend>
          <label class="radio"><input type="radio" name="ngReceiver" value="0" checked><span id="ngr0"></span></label>
          <label class="radio"><input type="radio" name="ngReceiver" value="1"><span id="ngr1"></span></label>
        </fieldset>
      </div>
      <div id="overlay-20s" class="hidden"></div>
      <div id="overlay-timer"></div>
      <div id="overlay-buttons">
        <button id="overlay-action" class="primary"></button>
        <button id="overlay-close" class="secondary hidden" data-i18n="ui.close">Close</button>
      </div>
    </div>
  </div>

</section>

<!-- ===== Score sheet (match report) ===== -->
<section id="sheet" class="screen hidden">
  <div id="sheet-scroll">
    <div id="sheet-page">
      <div id="sheet-notebar">
        <input type="text" id="note-input" autocomplete="off">
        <button type="button" id="note-add" data-i18n="sheet.addNote">Add note</button>
      </div>
      <div id="sheet-doc"></div>
    </div>
  </div>
  <div id="sheet-actions">
    <button type="button" id="sheet-print" data-i18n="sheet.print">Print</button>
    <button type="button" id="sheet-pdf" data-i18n="sheet.pdf">PDF</button>
    <button type="button" id="sheet-back" data-i18n="sheet.back">Back</button>
  </div>

  <!-- the same sheet as a PDF, in the browser's own viewer -->
  <div id="report" class="hidden">
    <header id="report-bar">
      <span id="report-title" data-i18n="ui.reportTitle">Match report</span>
      <a id="report-download" download data-i18n="ui.download">Download</a>
      <button type="button" id="report-close" data-i18n="ui.close">Close</button>
    </header>
    <iframe id="report-frame" title="Match report"></iframe>
  </div>
</section>

<script src="i18n.js"></script>
<script src="match.js"></script>
<script src="sheet.js"></script>
<script src="report.js"></script>
<script src="app.js"></script>
</body>
</html>
